<div id="modal-pesquisar-empresa" class="modal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Pesquisar</h5>
            <button 
                type="button"
                class="btn-close btn-close-white" 
                data-bs-dismiss="modal"
                aria-label="Close"
            >
            </button>
        </div>
        <div class="modal-body">
          <div class="container-fluid">

            <form>
  
                <div class="form-group">
                    <label for="termo-pesquisar-empresa">Empresa</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="termo-pesquisar-empresa" placeholder="Nome, Razão Social, CNPJ, N° do Processo ...">
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary" id="botao-pesquisar-empresa">
                                <i class="fas fa-search"></i>
                                Pesquisar
                            </button>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tipo-processo">Tipo do Processo</label>
                    <select class="form-control" id="tipo-processo" name="tipo-processo">
                        <option value="">-- Selecionar --</option>
                        <option value="RE">Recuperação</option>
                        <option value="FA">Falência</option>
                        <option value="IN">Insolvência</option>
                    </select>
                </div>                

            </form>

            </div>
        </div>
        <div class="modal-footer">
            <table class="table table-hover" id="resultado-empresa">
                <thead>
                    <tr>
                        <th width="10%" class="text-center">ID</th>
                        <th width="50%" class="text-left">Nome</th>
                        <th width="25%" class="text-left">Documento</th>
                        <th width="15%" class="text-left">Tipo</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
      </div>
    </div>
  </div>
