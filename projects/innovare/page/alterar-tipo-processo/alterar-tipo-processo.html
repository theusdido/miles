<p class="titulo-pagina">Alterar Tipo de Processo</p>
<form class="form tdform" id="form-alterar-tipo-processo">
    <div class="td-btn-group">
        <div class="loader-salvar"></div>
        <input type="button" class="btn btn-primary" id="btn-alterar" value="Alterar">
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="control-label" for="processo">Processo</label>
                <select class="form-select" name="processo" id="processo"></select>
            </div>
            <div class="mb-3">
                <label class="control-label" for="tipo">Tipo</label>
                <select class="form-select" name="tipo" id="tipo">
                    <option value="19" >Recuperação -> Falência</option>
                    <option value="16" disabled>Falência -> Recuperação</option>
                </select>
            </div>
        </div>
    </div>
</form>
